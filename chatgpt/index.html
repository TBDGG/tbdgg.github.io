<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>КВН — Цифровое поколение</title>
<style>
:root{
  --accent:#2563eb;--accent2:#1d4ed8;--bg:#f4f7fb;--card:#fff;--text:#101828;
  --muted:#667085;--border:#e4e7ec;--good:#16a34a;--bad:#dc2626;
  --shadow:0 20px 55px rgba(16,24,40,.09);--radius:22px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{transition:.35s;background:
 radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 35%),var(--bg)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button,.card,.team,.option,.tab,.iconbtn{transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,opacity .18s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.wrap{width:min(1180px,94%);margin:auto}
.center{min-height:100vh;display:grid;place-items:center;padding:22px}
.card{background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;backdrop-filter:blur(14px);animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes confetti{0%{transform:translateY(-10px) rotate(0);opacity:0}100%{transform:translateY(110vh) rotate(720deg);opacity:1}}
.logo{font-size:clamp(34px,6vw,62px);font-weight:950;letter-spacing:-3px}
.logo span{color:var(--accent)}
.subtitle{font-size:17px;line-height:1.6;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:780px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.card{padding:18px}.logo{letter-spacing:-2px}}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:12px;align-items:center}
.mt{margin-top:17px}.mb{margin-bottom:17px}
h1,h2,h3{margin-top:0}
label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}
input,select,textarea{
 width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:13px;
 background:#fff;outline:none;color:var(--text)
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
textarea{resize:vertical}
.btn{
 border:0;border-radius:14px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:850;
 box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 20%,transparent)
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 25px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.secondary{background:color-mix(in srgb,var(--accent) 10%,white);color:var(--accent2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.danger{background:#fee2e2;color:#991b1b;box-shadow:none}
.btn.good{background:#dcfce7;color:#166534;box-shadow:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;padding:10px 14px;border-radius:12px;background:#eef2f6;color:#344054;font-weight:800}
.tab:hover{transform:translateY(-1px)}
.tab.active{background:var(--accent);color:#fff}
.small{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:12px;font-weight:850}
.alert{padding:12px 14px;border-radius:14px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412}
.alert.good{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
.alert.bad{border-color:#fecaca;background:#fef2f2;color:#991b1b}
.topbar{position:sticky;top:0;z-index:50;background:rgba(244,247,251,.84);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:11px 0}
.team{
 position:relative;overflow:hidden;border:1px solid var(--border);border-radius:18px;padding:16px;background:#fff
}
.team:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--team)}
.team:hover{transform:translateY(-3px);box-shadow:0 13px 30px rgba(0,0,0,.08)}
.dot{width:11px;height:11px;border-radius:50%;background:#98a2b3;display:inline-block}
.dot.on{background:#22c55e;box-shadow:0 0 0 4px #dcfce7}
.score{font-size:31px;font-weight:950;font-variant-numeric:tabular-nums}
.question{font-size:clamp(27px,4.5vw,54px);font-weight:950;line-height:1.12;letter-spacing:-1.5px}
.timer{font-size:clamp(42px,7vw,82px);font-weight:950;color:var(--accent);font-variant-numeric:tabular-nums}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .08s linear}
.option{
 width:100%;padding:19px;border:2px solid var(--border);border-radius:18px;background:#fff;text-align:left;
 font-weight:850;font-size:17px
}
.option:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.06)}
.option.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,white)}
.answer-card{padding:14px;border:1px solid var(--border);border-radius:16px;background:#fff}
.answer-card.good{border-color:#86efac;background:#f0fdf4}
.answer-card.bad{border-color:#fecaca;background:#fef2f2}
.qbox{border:1px solid var(--border);border-radius:17px;padding:15px;background:#fff;margin-top:11px}
.qbox textarea{min-height:75px}
.rank{display:flex;align-items:center;gap:14px;padding:15px;border-radius:16px;background:#fff;border:1px solid var(--border)}
.ranknum{font-size:25px;font-weight:950;width:42px;text-align:center}
.big-score{font-size:clamp(48px,8vw,100px);font-weight:950;line-height:1}
.projector .topbar,.projector .admin-only{display:none!important}
.projector{background:#0b1020;color:#fff}
.projector .card{background:#121a2f;border-color:#263250;color:#fff}
.projector .small,.projector .subtitle{color:#aebbd7}
.projector .question{text-align:center}
.projector .timer{text-align:center}
.projector .progress{background:#263250}
.projector .rank{background:#151f37;border-color:#2a3858}
.toast{position:fixed;z-index:100;right:18px;bottom:18px;max-width:min(420px,calc(100% - 36px));padding:14px 17px;border-radius:15px;background:#101828;color:#fff;box-shadow:0 15px 35px rgba(0,0,0,.2);animation:pop .25s ease}
.confetti{position:fixed;top:-20px;width:8px;height:16px;z-index:90;animation:confetti 2.8s linear forwards}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   КВН «Цифровое поколение: знания об ИИ»
   Один HTML-файл. Данные сохраняются в localStorage.
   Это локальный прототип: разные устройства НЕ синхронизируются.
========================================================= */

const app=document.getElementById("app");
const KEY="kvn_ai_single_html_v1";

const DEFAULT_QUESTIONS=[
 {id:uid(),group:"7-9",type:"choice",text:"Что означает сокращение «ИИ»?",options:["Интернет информации","Искусственный интеллект","Интерактивный интерфейс","Информационный индекс"],correct:1,answer:"",points:10,time:20},
 {id:uid(),group:"7-9",type:"choice",text:"Что из перечисленного является примером генеративного ИИ?",options:["Генератор текста","Флешка","Клавиатура","Калькулятор"],correct:0,answer:"",points:10,time:20},
 {id:uid(),group:"7-9",type:"text",text:"Как называется набор данных, на котором обучают модель?",options:[],correct:0,answer:"датасет",points:20,time:30},
 {id:uid(),group:"10-11",type:"choice",text:"Что такое hallucination у языковой модели?",options:["Перегрев компьютера","Уверенно сгенерированный, но фактически неверный ответ","Потеря интернета","Вирус"],correct:1,answer:"",points:20,time:25},
 {id:uid(),group:"10-11",type:"choice",text:"Что обычно называют prompt?",options:["Запрос или инструкцию для ИИ","Пароль","Видеокарту","Тип базы данных"],correct:0,answer:"",points:20,time:20},
 {id:uid(),group:"10-11",type:"text",text:"Назовите один риск использования ИИ без проверки результата.",options:[],correct:0,answer:"ошибка|дезинформация|неверная информация|галлюцинация",points:30,time:40}
];

let db=loadDB();
let appState={
 role:null,classId:null,teamId:null,questionIndex:0,answer:null,questionStarted:0,
 mode:"normal",projector:false,timer:null
};

function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random().toString(16).slice(2)}
function loadDB(){
 try{
   const d=JSON.parse(localStorage.getItem(KEY)||"null");
   if(d) return d;
 }catch{}
 return {
   questions:structuredClone(DEFAULT_QUESTIONS),
   classes:{},
   teams:{},
   game:{}
 };
}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}
function clsData(id){
 if(!db.classes[id]) db.classes[id]={teams:[],running:false,index:0,results:{}};
 return db.classes[id]
}
function teamById(id){return db.teams[id]}
function questionsFor(id){
 return db.questions.filter(q=>q.group==(Number(id.match(/\d+/)[0])<=9?"7-9":"10-11"))
}
function gradeName(id){return id.slice(0,-1)+" класс "+id.slice(-1)}
function toast(text,bad=false){
 const x=document.createElement("div");
 x.className="toast";x.textContent=text;
 if(bad)x.style.background="#991b1b";
 document.body.appendChild(x);setTimeout(()=>x.remove(),2800)
}
function render(html){app.innerHTML=html}
function resetTheme(){document.documentElement.style.setProperty("--accent","#2563eb");document.documentElement.style.setProperty("--accent2","#1d4ed8");document.body.classList.remove("projector")}
function teamTheme(){
 const t=teamById(appState.teamId);
 document.documentElement.style.setProperty("--accent",t?.color||"#2563eb");
 document.documentElement.style.setProperty("--accent2",t?.color||"#1d4ed8");
}

/* ---------- старт ---------- */
function home(){
 resetTheme();
 render(`
 <div class="center">
  <div class="card" style="width:min(720px,100%);text-align:center">
   <div class="logo">КВН<span>.</span></div>
   <div class="subtitle">«Цифровое поколение: знания об ИИ»<br>Интерактивный урок информатики для 7–11 классов</div>
   <div class="grid2 mt">
    <button class="btn" onclick="adminLogin()">👨‍🏫 Я ведущий</button>
    <button class="btn secondary" onclick="teamLogin()">📱 Я команда</button>
   </div>
   <div class="small mt">Локальная версия • данные хранятся только в этом браузере</div>
  </div>
 </div>`);
}
function adminLogin(){
 render(`
 <div class="center"><div class="card" style="width:min(480px,100%)">
 <h2>Вход ведущего</h2><p class="subtitle">Введите код администратора.</p>
 <input id="adminCode" type="password" placeholder="Код администратора" onkeydown="if(event.key==='Enter')checkAdmin()">
 <button class="btn mt" style="width:100%" onclick="checkAdmin()">Войти</button>
 <button class="btn ghost mt" style="width:100%" onclick="home()">Назад</button>
 </div></div>`);
}
function checkAdmin(){
 if(document.getElementById("adminCode").value==="ImRealTBD"){
  appState.role="admin";classPicker();
 }else toast("Неверный код администратора",true)
}
function teamLogin(){
 render(`
 <div class="center"><div class="card" style="width:min(480px,100%)">
 <h2>Вход команды</h2>
 <p class="subtitle">В локальной версии код используется для выбора команды.</p>
 <input id="teamCode" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')checkTeam()">
 <button class="btn mt" style="width:100%" onclick="checkTeam()">Войти</button>
 <button class="btn ghost mt" style="width:100%" onclick="home()">Назад</button>
 </div></div>`);
}
function checkTeam(){
 const code=document.getElementById("teamCode").value.trim().toUpperCase();
 const found=Object.values(db.teams).find(t=>t.code===code);
 if(!found)return toast("Команда с таким кодом не найдена",true);
 appState={...appState,role:"team",classId:found.classId,teamId:found.id,questionIndex:clsData(found.classId).index};
 teamTheme();teamScreen();
}

/* ---------- выбор класса ---------- */
function classPicker(){
 resetTheme();
 render(`
 <div class="center"><div class="card" style="width:min(760px,100%)">
 <h2>Выберите класс</h2>
 <p class="subtitle">Выберите параллель, затем точный класс.</p>
 <div class="tabs" id="grades">${[7,8,9,10,11].map(g=>`<button class="tab" onclick="chooseGrade(${g},this)">${g} класс</button>`).join("")}</div>
 <div id="letters" class="grid3 mt"></div>
 </div></div>`)
}
function chooseGrade(g,el){
 document.querySelectorAll("#grades .tab").forEach(x=>x.classList.remove("active"));el.classList.add("active");
 const letters=g===11?["A","Б","В"]:["A","Б"];
 document.getElementById("letters").innerHTML=letters.map(l=>`<button class="btn secondary" onclick="chooseClass('${g}${l}')">${g}${l}</button>`).join("")
}
function chooseClass(id){appState.classId=id;adminPanel()}

/* ---------- админ ---------- */
function adminPanel(){
 resetTheme();
 const c=clsData(appState.classId),qs=questionsFor(appState.classId);
 render(`
 <div class="topbar"><div class="wrap between">
  <div><b>КВН · ${esc(gradeName(appState.classId))}</b><div class="small">Панель ведущего</div></div>
  <div class="row"><button class="btn secondary" onclick="projectorMode()">📺 Проектор</button><button class="btn ghost" onclick="classPicker()">Сменить класс</button></div>
 </div></div>
 <main class="wrap" style="padding:24px 0 60px">
  <div class="grid2">
   <section class="card">
    <div class="between"><h2>Команды</h2><span class="pill">${c.teams.length}/20</span></div>
    <div id="teamList">${c.teams.map(adminTeamCard).join("")||`<div class="alert">Команд пока нет. Создайте первую команду ниже.</div>`}</div>
    <div class="card mt" style="box-shadow:none">
     <h3>Добавить команду</h3>
     <div class="grid2"><input id="newTeamName" placeholder="Название команды"><input id="newTeamColor" type="color" value="#2563eb"></div>
     <button class="btn mt" onclick="addTeam()">Создать команду</button>
    </div>
   </section>
   <section class="card">
    <div class="between"><h2>Управление игрой</h2><span class="pill">${c.running?"ИГРА ИДЁТ":"ОЖИДАНИЕ"}</span></div>
    <div class="grid2">
     <button class="btn" onclick="startRound()">▶ Начать / перезапустить</button>
     <button class="btn secondary" onclick="nextRound()">Следующий вопрос</button>
    </div>
    <button class="btn danger mt" onclick="finishGame()">Завершить КВН</button>
    <div class="mt"><h3>Текущий вопрос</h3>
     ${c.running&&qs[c.index]?`<div class="alert good"><b>${esc(qs[c.index].text)}</b><br>${qs[c.index].points} баллов · ${qs[c.index].time} сек.</div>`:`<div class="alert">Раунд ещё не запущен.</div>`}
    </div>
    <div class="mt"><h3>Статусы ответов</h3><div class="grid2">${c.teams.map(t=>{
      const r=c.results[t.id];return `<div class="answer-card ${r?(r.correct?"good":"bad"):""}"><b>${esc(t.name)}</b><div class="small">${r?(r.hidden?"⚠ Ушёл со страницы":r.correct?"✓ Верно":"✕ Неверно"):"Ожидает ответа"}</div></div>`
    }).join("")}</div></div>
   </section>
  </div>
  <section class="card mt">
   <div class="between"><div><h2>Редактор вопросов</h2><div class="small">Для ${appState.classId.startsWith("1")?"10–11":"7–9"} классов</div></div><button class="btn" onclick="addQuestion()">+ Добавить</button></div>
   <div id="questionEditor">${qs.map(questionEditor).join("")}</div>
   <button class="btn mt" onclick="saveQuestions()">💾 Сохранить вопросы</button>
  </section>
 </main>`)
}
function adminTeamCard(t){
 return `<div class="team mt" style="--team:${t.color}">
  <div class="between"><div><b>${esc(t.name)}</b><div class="small">Код команды: <b>${t.code}</b></div></div><span class="pill">${t.score} очк.</span></div>
  <div class="row mt"><button class="btn secondary" onclick="changeScore('${t.id}',1)">+1</button><button class="btn secondary" onclick="changeScore('${t.id}',5)">+5</button><button class="btn secondary" onclick="changeScore('${t.id}',-1)">−1</button><button class="btn secondary" onclick="changeScore('${t.id}',-5)">−5</button><button class="btn danger" onclick="deleteTeam('${t.id}')">Удалить</button></div>
 </div>`
}
function addTeam(){
 const name=document.getElementById("newTeamName").value.trim();
 if(!name)return toast("Введите название команды",true);
 const c=clsData(appState.classId);if(c.teams.length>=20)return toast("Максимум 20 команд",true);
 let code;do{code=Array.from({length:5},()=>String.fromCharCode(65+Math.floor(Math.random()*26))).join("")}while(Object.values(db.teams).some(x=>x.code===code));
 const id=uid();db.teams[id]={id,name,color:document.getElementById("newTeamColor").value,code,score:0,classId:appState.classId};c.teams.push(id);saveDB();adminPanel();toast("Команда создана: "+code)
}
function deleteTeam(id){
 if(!confirm("Удалить команду?"))return;
 const c=clsData(appState.classId);c.teams=c.teams.filter(x=>x!==id);delete db.teams[id];saveDB();adminPanel()
}
function changeScore(id,n){db.teams[id].score=Math.max(0,db.teams[id].score+n);saveDB();adminPanel()}
function questionEditor(q,i){
 return `<div class="qbox" data-id="${q.id}">
  <div class="between"><b>Вопрос ${i+1}</b><button class="btn danger" onclick="this.closest('.qbox').remove()">Удалить</button></div>
  <div class="grid3 mt">
   <select class="qgroup"><option value="7-9" ${q.group==="7-9"?"selected":""}>7–9</option><option value="10-11" ${q.group==="10-11"?"selected":""}>10–11</option></select>
   <select class="qtype" onchange="changeQType(this)"><option value="choice" ${q.type==="choice"?"selected":""}>Тестовый</option><option value="text" ${q.type==="text"?"selected":""}>Письменный</option></select>
   <input class="qpoints" type="number" min="0" value="${q.points}" placeholder="Баллы">
  </div>
  <div class="grid2 mt"><textarea class="qtext" placeholder="Текст вопроса">${esc(q.text)}</textarea><input class="qtime" type="number" min="5" value="${q.time}" placeholder="Время, сек."></div>
  <div class="qoptions mt">${q.type==="choice"?choiceFields(q):textFields(q)}</div>
 </div>`
}
function choiceFields(q){
 return `${[0,1,2,3].map(i=>`<input class="qopt" value="${esc(q.options?.[i]||"")}" placeholder="Вариант ${i+1}">`).join("")}
 <select class="qcorrect mt">${[0,1,2,3].map(i=>`<option value="${i}" ${q.correct===i?"selected":""}>Правильный вариант: ${i+1}</option>`).join("")}</select>`
}
function textFields(q){return `<input class="qanswer" value="${esc(q.answer||"")}" placeholder="Правильный ответ. Несколько вариантов через |">`}
function changeQType(el){el.closest(".qbox").querySelector(".qoptions").innerHTML=el.value==="choice"?choiceFields({options:["","","",""],correct:0}):textFields({})}
function addQuestion(){
 const box=document.getElementById("questionEditor");
 box.insertAdjacentHTML("beforeend",questionEditor({id:uid(),group:"7-9",type:"choice",options:["","","",""],correct:0,answer:"",points:10,time:20},box.children.length))
}
function saveQuestions(){
 const arr=[...document.querySelectorAll(".qbox")].map(x=>{
  const type=x.querySelector(".qtype").value;
  return {
   id:x.dataset.id,group:x.querySelector(".qgroup").value,type,
   text:x.querySelector(".qtext").value.trim(),points:+x.querySelector(".qpoints").value||0,time:Math.max(5,+x.querySelector(".qtime").value||20),
   options:type==="choice"?[...x.querySelectorAll(".qopt")].map(o=>o.value.trim()):[],
   correct:type==="choice"?+x.querySelector(".qcorrect").value:0,
   answer:type==="text"?x.querySelector(".qanswer").value.trim():""
  }
 });
 db.questions=[...db.questions.filter(q=>q.group!=="7-9"&&q.group!=="10-11"),...arr];
 saveDB();adminPanel();toast("Вопросы сохранены")
}

/* ---------- игра ---------- */
function startRound(){
 const c=clsData(appState.classId),qs=questionsFor(appState.classId);
 if(!c.teams.length)return toast("Добавьте хотя бы одну команду",true);
 if(!qs.length)return toast("Нет вопросов",true);
 c.running=true;c.index=Math.min(c.index,qs.length-1);c.results={};c.started=Date.now();saveDB();
 appState.questionIndex=c.index;appState.questionStarted=c.started;appState.answer=null;
 gameScreenForAdmin();
}
function nextRound(){
 const c=clsData(appState.classId),qs=questionsFor(appState.classId);
 if(!qs.length)return;
 if(c.index>=qs.length-1){finishGame();return}
 c.index++;c.running=true;c.results={};c.started=Date.now();saveDB();
 appState.questionIndex=c.index;appState.questionStarted=c.started;appState.answer=null;
 if(appState.mode==="projector")projectorMode();else adminPanel()
}
function finishGame(){
 const c=clsData(appState.classId);c.running=false;saveDB();clearInterval(appState.timer);finalScreen()
}
function gameScreenForAdmin(){
 if(appState.mode==="projector"){projectorMode();return}
 render(`
 <div class="topbar"><div class="wrap between"><b>🎙 Ведущий · ${esc(gradeName(appState.classId))}</b><div class="row"><button class="btn secondary" onclick="projectorMode()">📺 Проектор</button><button class="btn ghost" onclick="adminPanel()">← Панель</button></div></div></div>
 <main class="wrap" style="padding:30px 0">
  <div class="card">
   <div class="between"><span class="pill">Вопрос ${appState.questionIndex+1}</span><div id="adminTimer" class="timer">--</div></div>
   <div class="progress mt"><i id="adminProgress"></i></div>
   <div class="question mt">${esc(questionsFor(appState.classId)[appState.questionIndex].text)}</div>
   <div class="subtitle mt">Ученики отвечают со своих телефонов. Ведущий ответы не вводит.</div>
  </div>
  <div class="card mt"><h2>Команды</h2><div id="liveTeams" class="grid3"></div></div>
 </main>`);
 startAdminTimer();renderLiveTeams()
}
function startAdminTimer(){
 clearInterval(appState.timer);
 const q=questionsFor(appState.classId)[appState.questionIndex],start=clsData(appState.classId).started;
 const tick=()=>{
  const left=Math.max(0,q.time*1000-(Date.now()-start));
  document.getElementById("adminTimer")&&(document.getElementById("adminTimer").textContent=Math.ceil(left/1000)+"с");
  document.getElementById("adminProgress")&&(document.getElementById("adminProgress").style.width=(left/(q.time*1000)*100)+"%");
  if(left<=0){clearInterval(appState.timer);renderLiveTeams()}
 };
 tick();appState.timer=setInterval(tick,100)
}
function renderLiveTeams(){
 const c=clsData(appState.classId),box=document.getElementById("liveTeams");if(!box)return;
 box.innerHTML=c.teams.map(id=>{
  const t=teamById(id),r=c.results[id];
  return `<div class="answer-card ${r?(r.correct?"good":"bad"):""}"><div class="between"><b>${esc(t.name)}</b><span class="score" style="font-size:25px">${t.score}</span></div><div class="mt">${r?(r.hidden?"⚠ Уход со страницы":r.correct?"✓ Верно":"✕ Неверно"):"⏳ Ожидает ответа"}</div></div>`
 }).join("");
}
function projectorMode(){
 appState.mode="projector";document.body.classList.add("projector");
 const c=clsData(appState.classId),qs=questionsFor(appState.classId),q=qs[c.index];
 render(`<main class="wrap" style="padding:4vh 0"><div class="card" style="min-height:92vh;display:flex;flex-direction:column;justify-content:center">
 <div class="between"><div><div class="small">КВН · ЦИФРОВОЕ ПОКОЛЕНИЕ</div><h1>${esc(gradeName(appState.classId))}</h1></div><button class="btn secondary admin-only" onclick="adminPanel()">Панель</button></div>
 ${c.running&&q?`<div style="text-align:center"><div class="pill">ВОПРОС ${c.index+1} · ${q.points} БАЛЛОВ</div><div class="question mt">${esc(q.text)}</div><div id="projTimer" class="timer mt">--</div><div class="progress mt"><i id="projProgress"></i></div></div>`:`<div style="text-align:center"><div class="logo">Готовы?</div><p class="subtitle">Ведущий ещё не запустил раунд.</p></div>`}
 <div class="grid3 mt">${c.teams.sort((a,b)=>teamById(b).score-teamById(a).score).map((id,i)=>{const t=teamById(id);return `<div class="rank"><div class="ranknum">${i+1}</div><div style="flex:1"><b>${esc(t.name)}</b></div><strong>${t.score}</strong></div>`}).join("")}</div>
 </div></main>`;
 if(c.running&&q)startProjectorTimer()
}
function startProjectorTimer(){
 clearInterval(appState.timer);
 const c=clsData(appState.classId),q=questionsFor(appState.classId)[c.index],start=c.started;
 const tick=()=>{
  const left=Math.max(0,q.time*1000-(Date.now()-start));
  const tm=document.getElementById("projTimer"),bar=document.getElementById("projProgress");
  if(tm)tm.textContent=Math.ceil(left/1000)+"с";if(bar)bar.style.width=left/(q.time*1000)*100+"%";
  if(left<=0)clearInterval(appState.timer)
 };
 tick();appState.timer=setInterval(tick,100)
}

/* ---------- экран команды ---------- */
function teamScreen(){
 teamTheme();
 const c=clsData(appState.classId);
 if(!c.running){waitingScreen();return}
 const q=questionsFor(appState.classId)[c.index];
 if(!q){waitingScreen();return}
 appState.questionIndex=c.index;appState.questionStarted=c.started;appState.answer=null;
 render(`<main class="wrap" style="padding:24px 0 45px">
  <div class="between mb"><div><b>${esc(teamById(appState.teamId).name)}</b><div class="small">${esc(gradeName(appState.classId))}</div></div><span class="pill">${teamById(appState.teamId).score} баллов</span></div>
  <div class="card">
   <div class="between"><span class="pill">${q.points} БАЛЛОВ</span><div id="teamTimer" class="timer">--</div></div>
   <div class="progress mt"><i id="teamProgress"></i></div>
   <div class="question mt">${esc(q.text)}</div>
   <div id="teamAnswers" class="mt ${q.type==="choice"?"grid2":""}">
    ${q.type==="choice"?q.options.map((o,i)=>`<button class="option" onclick="teamAnswer(${i})">${esc(o)}</button>`).join(""):`<textarea id="written" rows="5" placeholder="Напишите свой ответ..."></textarea><button class="btn mt" onclick="teamWritten()">Отправить ответ</button>`}
   </div>
   <div id="teamStatus" class="mt"></div>
  </div>
 </main>`);
 startTeamTimer()
}
function waitingScreen(){
 teamTheme();const t=teamById(appState.teamId);
 render(`<div class="center"><div class="card" style="width:min(650px,100%);text-align:center">
 <div class="small">КОМАНДА</div><div class="logo">${esc(t.name)}</div><div class="big-score">${t.score}</div><div class="subtitle">баллов</div>
 <div class="alert mt">Ожидайте запуска следующего вопроса ведущим.</div>
 </div></div>`)
}
function startTeamTimer(){
 clearInterval(appState.timer);
 const c=clsData(appState.classId),q=questionsFor(appState.classId)[c.index],start=c.started;
 const tick=()=>{
  const left=Math.max(0,q.time*1000-(Date.now()-start));
  const tm=document.getElementById("teamTimer"),bar=document.getElementById("teamProgress");
  if(tm)tm.textContent=Math.ceil(left/1000)+"с";if(bar)bar.style.width=left/(q.time*1000)*100+"%";
  if(left<=0){clearInterval(appState.timer);disableTeamAnswers()}
 };
 tick();appState.timer=setInterval(tick,100)
}
function disableTeamAnswers(){document.querySelectorAll("#teamAnswers button,#teamAnswers textarea").forEach(x=>x.disabled=true);const s=document.getElementById("teamStatus");if(s)s.innerHTML='<div class="alert bad">Время вышло.</div>'}
function teamAnswer(i){sendTeamAnswer(String(i))}
function teamWritten(){sendTeamAnswer(document.getElementById("written").value)}
function sendTeamAnswer(raw){
 if(appState.answer!==null)return;
 const c=clsData(appState.classId),q=questionsFor(appState.classId)[c.index];
 if(Date.now()>c.started+q.time*1000)return disableTeamAnswers();
 appState.answer=raw;
 const correct=q.type==="choice"?Number(raw)===q.correct:q.answer.split("|").map(x=>x.trim().toLowerCase()).includes(raw.trim().toLowerCase());
 if(correct)teamById(appState.teamId).score+=q.points;
 c.results[appState.teamId]={correct,hidden:false,at:Date.now()};
 saveDB();disableTeamAnswers();
 document.getElementById("teamStatus").innerHTML='<div class="alert good">Ответ принят. Ждите результата.</div>';
}

/* ---------- анти-уход ---------- */
document.addEventListener("visibilitychange",()=>{
 if(appState.role==="team"&&document.visibilityState!=="visible")markViolation()
});
window.addEventListener("blur",()=>{if(appState.role==="team")markViolation()});
function markViolation(){
 if(!appState.classId||!appState.teamId)return;
 const c=clsData(appState.classId);
 if(c.running&&!appState.answer){
   c.results[appState.teamId]={correct:false,hidden:true,at:Date.now()};
   appState.answer="__HIDDEN__";saveDB();
   toast("Вы покинули страницу. Ответ не засчитан.",true);
 }
}

/* ---------- финал ---------- */
function finalScreen(){
 resetTheme();
 const c=clsData(appState.classId);
 const teams=c.teams.map(id=>teamById(id)).sort((a,b)=>b.score-a.score);
 render(`<div class="center"><div class="card" style="width:min(900px,100%);text-align:center">
 <div class="small">КВН ЗАВЕРШЁН</div><div class="logo">Результаты<span>.</span></div>
 <div class="grid3 mt">${teams.map((t,i)=>`<div class="rank"><div class="ranknum">${i+1}</div><div style="flex:1;text-align:left"><b>${esc(t.name)}</b></div><strong>${t.score}</strong></div>`).join("")}</div>
 <div class="row mt" style="justify-content:center"><button class="btn" onclick="celebrate()">🎉 Праздник</button><button class="btn secondary" onclick="adminPanel()">← Панель</button></div>
 </div></div>`);
}
function celebrate(){
 for(let i=0;i<90;i++){const x=document.createElement("i");x.className="confetti";x.style.left=Math.random()*100+"vw";x.style.animationDelay=Math.random()*.7+"s";x.style.background=["#2563eb","#f59e0b","#22c55e","#ef4444","#a855f7"][Math.floor(Math.random()*5)];document.body.appendChild(x);setTimeout(()=>x.remove(),3600)}
}

/* ---------- локальный экспорт/сброс ---------- */
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kvn-backup.json";a.click();URL.revokeObjectURL(a.href)
}
function importData(){
 const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);saveDB();location.reload()}catch{toast("Файл повреждён",true)}};r.readAsText(f)};i.click()
}

/* ---------- автоматический переход ---------- */
window.addEventListener("storage",()=>{if(appState.role==="team")teamScreen()});
home();
</script>
</body>
</html>
